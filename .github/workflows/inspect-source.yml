name: Inspect extracted app source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original project archive
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          zpath = next(pathlib.Path('.').glob('*.zip'))
          root = pathlib.Path('audit-source')
          root.mkdir()
          with zipfile.ZipFile(zpath) as z:
              for item in z.infolist():
                  target = (root / item.filename).resolve()
                  if root.resolve() not in target.parents and target != root.resolve():
                      raise SystemExit('Unsafe archive path')
              z.extractall(root)
          print('Extracted', sum(1 for p in root.rglob('*') if p.is_file()), 'files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Yusif-3AMAK-source-audit
          path: audit-source/
          if-no-files-found: error
          retention-days: 7
