name: Build APK from project ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect and extract project archive
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output extracted
          python3 <<'PY'
          import json, os, pathlib, zipfile
          base = pathlib.Path.cwd()
          dest = base / "extracted"
          archive = next(iter(sorted(base.glob("*.zip"))), None)
          if archive is None:
              raise SystemExit("No ZIP archive found in the repository root.")
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (dest / item.filename).resolve()
                  if dest.resolve() not in target.parents and target != dest.resolve():
                      raise SystemExit("Unsafe path in ZIP: " + item.filename)
              z.extractall(dest)

          files = [p for p in dest.rglob("*") if p.is_file()]
          lines = [f"Archive: {archive.name}", f"Extracted files: {len(files)}", "", "File listing:"]
          lines.extend(str(p.relative_to(dest)) for p in sorted(files)[:5000])
          (base / "build-output" / "inspection.txt").write_text("\n".join(lines), encoding="utf-8")

          kind, root = "unknown", dest
          apk = next((p for p in files if p.suffix.lower() == ".apk"), None)
          if apk:
              kind, root = "apk", apk
          else:
              manifests = list(dest.rglob("src/main/AndroidManifest.xml"))
              roots = []
              for manifest in manifests:
                  for parent in manifest.parents:
                      if (parent / "settings.gradle").exists() or (parent / "settings.gradle.kts").exists():
                          roots.append(parent)
                          break
              if roots:
                  kind, root = "android", min(roots, key=lambda p: len(p.parts))
              else:
                  pubspec = next(iter(dest.rglob("pubspec.yaml")), None)
                  if pubspec:
                      kind, root = "flutter", pubspec.parent
                  else:
                      cap = next((p for p in dest.rglob("capacitor.config.*")
                                  if p.suffix in (".ts", ".js", ".json", ".mjs")), None)
                      if cap:
                          kind, root = "capacitor", cap.parent
                      else:
                          detected = None
                          for pkg in dest.rglob("package.json"):
                              if "node_modules" in pkg.parts:
                                  continue
                              try:
                                  data = json.loads(pkg.read_text(encoding="utf-8"))
                              except Exception:
                                  continue
                              deps = {}
                              deps.update(data.get("dependencies") or {})
                              deps.update(data.get("devDependencies") or {})
                              if "expo" in deps:
                                  detected = ("expo", pkg.parent); break
                              if "cordova" in deps or (pkg.parent / "config.xml").exists():
                                  detected = ("cordova", pkg.parent); break
                          if detected:
                              kind, root = detected
                          else:
                              index = next((p for p in dest.rglob("index.html")
                                            if "node_modules" not in p.parts and ".git" not in p.parts), None)
                              if index:
                                  kind, root = "web", index.parent

          rel = str(root.relative_to(base))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"kind={kind}\nproject_root={rel}\n")
          print(f"Detected project type: {kind}")
          print(f"Project path: {rel}")
          print("\n".join(lines[:120]))
          PY

      - name: Set up Java
        if: steps.inspect.outputs.kind != 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.inspect.outputs.kind != 'apk'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        if: steps.inspect.outputs.kind != 'apk'
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        if: contains(fromJSON('["android","expo","capacitor","cordova","web"]'), steps.inspect.outputs.kind)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node.js
        if: contains(fromJSON('["expo","capacitor","cordova","web"]'), steps.inspect.outputs.kind)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use APK already in archive
        if: steps.inspect.outputs.kind == 'apk'
        run: cp "${{ steps.inspect.outputs.project_root }}" build-output/Yusif-3AMAK.apk

      - name: Build Android Gradle project
        if: steps.inspect.outputs.kind == 'android'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.inspect.outputs.project_root }}"
          if [[ -f ./gradlew ]]; then chmod +x ./gradlew; ./gradlew --no-daemon assembleDebug; else gradle --no-daemon assembleDebug; fi
          APK="$(find . -type f -path '*/build/outputs/apk/*/*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/build-output/Yusif-3AMAK-debug.apk"

      - name: Set up Flutter
        if: steps.inspect.outputs.kind == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter APK
        if: steps.inspect.outputs.kind == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.inspect.outputs.project_root }}"
          flutter pub get
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/build-output/Yusif-3AMAK-debug.apk"

      - name: Build Capacitor Android project
        if: steps.inspect.outputs.kind == 'capacitor'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.inspect.outputs.project_root }}"
          # Restore missing ambience photos without changing application source files.
          mkdir -p src/assets/photos
          echo "Ambience photo references:"
          grep -nE "assets/photos/[^'\"]+\.jpg" src/lib/ambience.ts || true
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            "https://images.unsplash.com/photo-1517359795165-71871b9e3266?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=82&w=1920" \
            --output src/assets/photos/dawn.jpg
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            "https://images.unsplash.com/photo-1434238803228-c45b4b3faf75?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=82&w=1920" \
            --output src/assets/photos/noon.jpg
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            "https://images.unsplash.com/photo-1649200893528-972b2b6b942b?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=82&w=1920" \
            --output src/assets/art/fanous.jpg
          test -s src/assets/photos/dawn.jpg
          test -s src/assets/photos/noon.jpg
          test -s src/assets/art/fanous.jpg
          file src/assets/photos/dawn.jpg src/assets/photos/noon.jpg src/assets/art/fanous.jpg
          npm ci
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path("src").resolve()
          pattern = re.compile(r"""(?:from\s*|import\s*\()\s*['"]([^'"]+\.(?:png|jpe?g|webp|gif|avif))['"]""", re.I)
          print("Missing relative image imports:")
          for source in root.rglob("*"):
              if source.suffix not in {".ts", ".tsx", ".js", ".jsx"}:
                  continue
              try:
                  content = source.read_text(encoding="utf-8")
              except Exception:
                  continue
              for spec in pattern.findall(content):
                  if not spec.startswith("."):
                      continue
                  target = (source.parent / spec).resolve()
                  if root in target.parents and not target.exists():
                      print(f"{source.relative_to(root)} -> {target.relative_to(root)}")
          PY
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then npm run build; fi
          if [[ ! -d android ]]; then npx cap add android; fi
          npx cap sync android
          cd android
          if [[ -f ./gradlew ]]; then chmod +x ./gradlew; ./gradlew --no-daemon assembleDebug; else gradle --no-daemon assembleDebug; fi
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/build-output/Yusif-3AMAK-debug.apk"

      - name: Build Expo or Cordova project
        if: contains(fromJSON('["expo","cordova"]'), steps.inspect.outputs.kind)
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.inspect.outputs.project_root }}"
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          if [[ "${{ steps.inspect.outputs.kind }}" == "expo" ]]; then
            npx expo prebuild --platform android --non-interactive
            cd android
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/build-output/Yusif-3AMAK-debug.apk"
          else
            if [[ ! -d platforms/android ]]; then npx cordova platform add android; fi
            npx cordova build android --debug
            cp platforms/android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/build-output/Yusif-3AMAK-debug.apk"
          fi

      - name: Build static web project as an Android app
        if: steps.inspect.outputs.kind == 'web'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="$GITHUB_WORKSPACE/${{ steps.inspect.outputs.project_root }}"
          cd "$SOURCE_ROOT"
          if [[ -f package.json ]]; then
            if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then npm run build; fi
          fi
          WEB_ROOT=""
          for candidate in dist build www; do
            if [[ -f "$SOURCE_ROOT/$candidate/index.html" ]]; then WEB_ROOT="$SOURCE_ROOT/$candidate"; break; fi
          done
          if [[ -z "$WEB_ROOT" && -f "$SOURCE_ROOT/index.html" ]]; then WEB_ROOT="$SOURCE_ROOT"; fi
          test -n "$WEB_ROOT" && test -f "$WEB_ROOT/index.html"

          APP="$GITHUB_WORKSPACE/android-wrapper"
          mkdir -p "$APP/app/src/main/assets/website" "$APP/app/src/main/java/com/yusif3amak/wrapper"
          cp -a "$WEB_ROOT/." "$APP/app/src/main/assets/website/"
          cat > "$APP/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Yusif3AMAK"
          include(":app")
          EOF
          cat > "$APP/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > "$APP/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.yusif3amak.wrapper'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.yusif3amak.wrapper'
                  minSdk 23
                  targetSdk 32
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > "$APP/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="Yusif 3AMAK" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > "$APP/app/src/main/java/com/yusif3amak/wrapper/MainActivity.java" <<'EOF'
          package com.yusif3amak.wrapper;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  WebView view = new WebView(this);
                  WebSettings settings = view.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  view.setWebViewClient(new WebViewClient());
                  setContentView(view);
                  view.loadUrl("file:///android_asset/website/index.html");
              }
          }
          EOF
          cd "$APP"
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/build-output/Yusif-3AMAK-debug.apk"

      - name: Report unsupported project format
        if: steps.inspect.outputs.kind == 'unknown'
        run: |
          echo "No supported Android, Flutter, Capacitor, Expo, Cordova, or web entry point was found." | tee -a build-output/inspection.txt
          exit 1

      - name: Upload APK and inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yusif-3AMAK-APK
          path: build-output/
          if-no-files-found: warn
          retention-days: 30
