name: Build DAYFLOW native Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect source and enforce native Compose architecture
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted build-output
          python3 <<'PY'
          import os, pathlib, zipfile, sys
          base = pathlib.Path.cwd()
          archives = sorted(base.glob("*.zip"))
          if not archives:
              raise SystemExit("BLOCKED: no source ZIP found. Supply the DAYFLOW native Android project.")
          archive = archives[0]
          dest = base / "extracted"
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (dest / item.filename).resolve()
                  if dest.resolve() not in target.parents and target != dest.resolve():
                      raise SystemExit("Unsafe path in ZIP: " + item.filename)
              z.extractall(dest)

          gradle_roots = []
          for manifest in dest.rglob("app/src/main/AndroidManifest.xml"):
              app = manifest.parent.parent.parent
              root = app.parent
              if (root / "settings.gradle").exists() or (root / "settings.gradle.kts").exists():
                  gradle_roots.append(root)
          if not gradle_roots:
              cap = next(dest.rglob("capacitor.config.*"), None)
              if cap:
                  raise SystemExit(
                      "BLOCKED: the supplied DAYFLOW source is a React/Vite + Capacitor project. "
                      "Capacitor renders the primary UI in WebView. No APK was built or uploaded. "
                      "A real Kotlin/Jetpack Compose application source is required before APK builds can resume."
                  )
              raise SystemExit("BLOCKED: no complete native Android Gradle project was found in the source archive.")

          root = min(gradle_roots, key=lambda p: len(p.parts))
          main_files = list(root.glob("app/src/main/java/**/MainActivity.kt")) + list(root.glob("app/src/main/kotlin/**/MainActivity.kt"))
          if not main_files:
              raise SystemExit("BLOCKED: native Compose MainActivity.kt is missing.")
          main_text = "\n".join(p.read_text(encoding="utf-8") for p in main_files)
          if "ComponentActivity" not in main_text or "setContent" not in main_text:
              raise SystemExit("BLOCKED: launcher activity is not a Jetpack Compose ComponentActivity.")
          if any(token in main_text for token in ("BridgeActivity", "WebView", "loadUrl(")):
              raise SystemExit("BLOCKED: launcher activity contains a WebView/Capacitor entry point.")

          source_roots = [root / "app/src/main/java", root / "app/src/main/kotlin"]
          forbidden = ("android.webkit.WebView", "WebViewClient", "com.getcapacitor.BridgeActivity", "loadUrl(\"file:///android_asset")
          offenders = []
          for source_root in source_roots:
              if not source_root.exists():
                  continue
              for p in source_root.rglob("*"):
                  if p.suffix not in (".kt", ".java"):
                      continue
                  body = p.read_text(encoding="utf-8", errors="replace")
                  if any(token in body for token in forbidden):
                      offenders.append(str(p.relative_to(root)))
          if offenders:
              raise SystemExit("BLOCKED: WebView-based app source detected: " + ", ".join(offenders[:20]))

          gradle_text = ""
          for p in (root / "app/build.gradle", root / "app/build.gradle.kts", root / "build.gradle", root / "build.gradle.kts"):
              if p.exists():
                  gradle_text += p.read_text(encoding="utf-8", errors="replace") + "\n"
          if "compose" not in gradle_text.lower():
              raise SystemExit("BLOCKED: Jetpack Compose dependencies/buildFeatures were not found in Gradle configuration.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"project_root={root.relative_to(base)}\n")
          print("Native Compose source gate passed:", root.relative_to(base))
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native Android app
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.inspect.outputs.project_root }}"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -size +0c | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/build-output/DAYFLOW-native-debug.apk"

      - name: Verify APK integrity and reject web-shell artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile
          apks = list(pathlib.Path("build-output").glob("*.apk"))
          if len(apks) != 1 or apks[0].stat().st_size <= 0:
              raise SystemExit("APK verification failed: expected exactly one non-empty APK.")
          apk_path = apks[0]
          with zipfile.ZipFile(apk_path) as apk:
              names = set(apk.namelist())
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("APK verification failed: AndroidManifest.xml missing.")
              if not any(n.startswith("classes") and n.endswith(".dex") for n in names):
                  raise SystemExit("APK verification failed: DEX bytecode missing.")
              bad = [n for n in names if n.startswith("assets/") and (n.endswith("index.html") or "capacitor" in n.lower())]
              if bad:
                  raise SystemExit("APK verification failed: web-shell assets detected: " + ", ".join(bad[:10]))
              corrupt = apk.testzip()
              if corrupt:
                  raise SystemExit("APK verification failed: corrupt entry " + corrupt)
          print("Verified native APK archive:", apk_path, "bytes:", apk_path.stat().st_size)
          PY


      # Run the product-data port even when the native Compose gate blocks this
      # source archive. This gives a verified migration artifact without ever
      # producing or publishing a WebView APK.
      - name: Extract and validate DAYFLOW native catalogs
        if: always() && hashFiles('extracted/src/lib/themes.ts', 'extracted/src/lib/widgets.ts') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/port-native-catalogs.py
          python3 .github/scripts/port-native-catalogs.py \
            --source-lib extracted/src/lib \
            --output build-output/native-catalogs

      - name: Remove downloader product from DAYFLOW source
        if: always() && hashFiles('extracted/src/App.tsx') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/remove-downloader-features.py
          python3 .github/scripts/remove-downloader-features.py --source-root extracted
          test ! -e extracted/src/screens/Downloads.tsx
          test ! -e extracted/src/screens/MediaHub.tsx
          test ! -e extracted/src/lib/downloads.ts
          test ! -e extracted/src/lib/media.ts
          test ! -e extracted/src/lib/share.ts
          test -s extracted/src/lib/format.ts
          ! grep -RniE 'DownloadManager|yt-dlp|gallery-dl|N_m3u8DL|aria2c|enqueueDownload|startDownload|openSniffer|#/downloads|Media Hub' extracted/src extracted/android/app/src/main
          echo "Downloader removal and source invariant checks passed."

      - name: Set up Node for legacy source regression build
        if: always() && hashFiles('extracted/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build cleaned DAYFLOW web source for migration regression only
        if: always() && hashFiles('extracted/package-lock.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          cd extracted
          npm ci
          npm run build
          test -s dist/index.html
          echo "Vite source regression passed. This is not an Android APK and is not the Android UI release."

      - name: Upload downloader-free DAYFLOW source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-downloader-free-source
          path: |
            extracted/src/**
            extracted/android/app/src/main/**
            extracted/package.json
            extracted/package-lock.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload native catalog migration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-native-catalogs
          path: build-output/native-catalogs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload verified native APK
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-native-Android-APK
          path: build-output/DAYFLOW-native-debug.apk
          if-no-files-found: error
          retention-days: 30
