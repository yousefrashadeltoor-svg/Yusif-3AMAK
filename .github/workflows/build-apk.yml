name: Build DAYFLOW Android APK
run-name: DAYFLOW APK build — ${{ github.ref_name }}

on:
  push:
    branches: [repair/widget-native-state-bridge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build DAYFLOW APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify and extract the real DAYFLOW source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted build-output
          python3 - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path.cwd()
          archives = sorted(root.glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one source ZIP, found {len(archives)}")
          archive = archives[0]
          dest = root / "extracted"
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit("Corrupt source ZIP entry: " + bad)
              for entry in z.infolist():
                  target = (dest / entry.filename).resolve()
                  if dest.resolve() not in target.parents and target != dest.resolve():
                      raise SystemExit("Unsafe path in archive: " + entry.filename)
              z.extractall(dest)
          files = [p for p in dest.rglob("*") if p.is_file()]
          if len(files) != 137:
              raise SystemExit(f"Unexpected source inventory: {len(files)} files")
          cap = next((p for p in dest.rglob("capacitor.config.*") if p.suffix in {".ts",".js",".json",".mjs"}), None)
          if not cap:
              raise SystemExit("Capacitor project configuration is missing")
          project = cap.parent
          with open(root / "build-output" / "project-root.txt", "w", encoding="utf-8") as out:
              out.write(str(project.relative_to(root)))
          print("Verified source archive:", archive.name)
          print("Extracted files:", len(files))
          print("Detected project type: Capacitor")
          print("Project root:", project.relative_to(root))
          PY
      - name: Upload source inspection report
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-source-inspection
          path: build-output/project-root.txt
          if-no-files-found: error
          retention-days: 7
