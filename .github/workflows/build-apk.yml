name: Build DAYFLOW Android APK
run-name: DAYFLOW verified APK — ${{ github.ref_name }}

on:
  push:
    branches: [repair/widget-native-state-bridge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build and verify DAYFLOW Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and extract project archive
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output extracted
          python3 <<'PY'
          import json, os, pathlib, zipfile
          base = pathlib.Path.cwd()
          dest = base / "extracted"
          archive = next(iter(sorted(base.glob("*.zip"))), None)
          if archive is None:
              raise SystemExit("No ZIP archive found in the repository root.")
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (dest / item.filename).resolve()
                  if dest.resolve() not in target.parents and target != dest.resolve():
                      raise SystemExit("Unsafe path in ZIP: " + item.filename)
              z.extractall(dest)

          files = [p for p in dest.rglob("*") if p.is_file()]
          lines = [f"Archive: {archive.name}", f"Extracted files: {len(files)}", "", "File listing:"]
          lines.extend(str(p.relative_to(dest)) for p in sorted(files)[:5000])
          (base / "build-output" / "inspection.txt").write_text("\n".join(lines), encoding="utf-8")

          kind, root = "unknown", dest
          apk = next((p for p in files if p.suffix.lower() == ".apk"), None)
          if apk:
              kind, root = "apk", apk
          else:
              manifests = list(dest.rglob("src/main/AndroidManifest.xml"))
              roots = []
              for manifest in manifests:
                  for parent in manifest.parents:
                      if (parent / "settings.gradle").exists() or (parent / "settings.gradle.kts").exists():
                          roots.append(parent)
                          break
              if roots:
                  kind, root = "android", min(roots, key=lambda p: len(p.parts))
              else:
                  pubspec = next(iter(dest.rglob("pubspec.yaml")), None)
                  if pubspec:
                      kind, root = "flutter", pubspec.parent
                  else:
                      cap = next((p for p in dest.rglob("capacitor.config.*")
                                  if p.suffix in (".ts", ".js", ".json", ".mjs")), None)
                      if cap:
                          kind, root = "capacitor", cap.parent
                      else:
                          detected = None
                          for pkg in dest.rglob("package.json"):
                              if "node_modules" in pkg.parts:
                                  continue
                              try:
                                  data = json.loads(pkg.read_text(encoding="utf-8"))
                              except Exception:
                                  continue
                              deps = {}
                              deps.update(data.get("dependencies") or {})
                              deps.update(data.get("devDependencies") or {})
                              if "expo" in deps:
                                  detected = ("expo", pkg.parent); break
                              if "cordova" in deps or (pkg.parent / "config.xml").exists():
                                  detected = ("cordova", pkg.parent); break
                          if detected:
                              kind, root = detected
                          else:
                              index = next((p for p in dest.rglob("index.html")
                                            if "node_modules" not in p.parts and ".git" not in p.parts), None)
                              if index:
                                  kind, root = "web", index.parent

          rel = str(root.relative_to(base))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"kind={kind}\nproject_root={rel}\n")
          print(f"Detected project type: {kind}")
          print(f"Project path: {rel}")
          print("\n".join(lines[:120]))
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build DAYFLOW using the native Android integration script
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.inspect.outputs.project_root }}
        run: |
          set -euo pipefail
          bash .github/scripts/build-dayflow-android.sh

      - name: Export expanded Android source for audit
        if: always() && steps.inspect.outputs.kind == 'capacitor'
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-expanded-android-source
          path: |
            ${{ steps.inspect.outputs.project_root }}/src/**
            ${{ steps.inspect.outputs.project_root }}/android/app/src/main/java/**
            ${{ steps.inspect.outputs.project_root }}/android/app/src/main/res/**
            ${{ steps.inspect.outputs.project_root }}/android/app/src/main/AndroidManifest.xml
            ${{ steps.inspect.outputs.project_root }}/android/app/build.gradle
            ${{ steps.inspect.outputs.project_root }}/android/build.gradle
            ${{ steps.inspect.outputs.project_root }}/package.json
            ${{ steps.inspect.outputs.project_root }}/package-lock.json
            ${{ steps.inspect.outputs.project_root }}/capacitor.config.*
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK structure and Android signature
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/build-output/Yusif-3AMAK-debug.apk"
          test -s "$APK"
          python3 - "$APK" <<'PY'
          import pathlib, sys, zipfile
          apk = pathlib.Path(sys.argv[1])
          if apk.stat().st_size < 500_000:
              raise SystemExit(f"APK is implausibly small: {apk.stat().st_size} bytes")
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("AndroidManifest.xml is missing")
              if not any(name.startswith("classes") and name.endswith(".dex") for name in names):
                  raise SystemExit("DEX bytecode is missing")
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Corrupt APK entry: " + bad)
          print(f"APK ZIP structure valid: {apk.stat().st_size} bytes")
          PY
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -E "^package:"
          printf '%s\n' "$BADGING" | grep -E "^application-label:"

      - name: Cold-launch DAYFLOW on Android Emulator
        if: success()
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$GITHUB_WORKSPACE/build-output/Yusif-3AMAK-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb shell pm path app.dayflow.android | grep -q '^package:'
            adb logcat -c
            adb shell pm grant app.dayflow.android android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop app.dayflow.android
            adb shell monkey -p app.dayflow.android -c android.intent.category.LAUNCHER 1
            PID=""
            for attempt in $(seq 1 30); do
              PID="$(adb shell pidof app.dayflow.android 2>/dev/null | tr -d '\r' || true)"
              if [[ -n "$PID" ]]; then break; fi
              sleep 1
            done
            test -n "$PID"
            sleep 8
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -F 'app.dayflow.android'
            CRASH_LOG="$(adb logcat -d -s AndroidRuntime:E)"
            if printf '%s\n' "$CRASH_LOG" | grep -B2 -A8 -F 'Process: app.dayflow.android'; then
              echo "DAYFLOW crashed during emulator cold launch." >&2
              exit 1
            fi
            echo "DAYFLOW installed and cold-launched successfully on Android API 35 (PID=$PID)."
      - name: Upload verified APK and build report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-verified-APK
          path: |
            build-output/Yusif-3AMAK-debug.apk
            build-output/inspection.txt
          if-no-files-found: error
          retention-days: 30
