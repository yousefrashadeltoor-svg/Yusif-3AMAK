name: Build DAYFLOW native Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dayflow-native-compose-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect source and enforce native Compose architecture
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted build-output
          python3 <<'PY'
          import os, pathlib, zipfile, sys
          base = pathlib.Path.cwd()
          archives = sorted(base.glob("*.zip"))
          if not archives:
              raise SystemExit("BLOCKED: no source ZIP found. Supply the DAYFLOW native Android project.")
          archive = archives[0]
          dest = base / "extracted"
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (dest / item.filename).resolve()
                  if dest.resolve() not in target.parents and target != dest.resolve():
                      raise SystemExit("Unsafe path in ZIP: " + item.filename)
              z.extractall(dest)

          gradle_roots = []
          for manifest in dest.rglob("app/src/main/AndroidManifest.xml"):
              app = manifest.parent.parent.parent
              root = app.parent
              if (root / "settings.gradle").exists() or (root / "settings.gradle.kts").exists():
                  gradle_roots.append(root)
          if not gradle_roots:
              cap = next(dest.rglob("capacitor.config.*"), None)
              if cap:
                  raise SystemExit(
                      "BLOCKED: the supplied DAYFLOW source is a React/Vite + Capacitor project. "
                      "Capacitor renders the primary UI in WebView. No APK was built or uploaded. "
                      "A real Kotlin/Jetpack Compose application source is required before APK builds can resume."
                  )
              raise SystemExit("BLOCKED: no complete native Android Gradle project was found in the source archive.")

          root = min(gradle_roots, key=lambda p: len(p.parts))
          main_files = list(root.glob("app/src/main/java/**/MainActivity.kt")) + list(root.glob("app/src/main/kotlin/**/MainActivity.kt"))
          if not main_files:
              raise SystemExit("BLOCKED: native Compose MainActivity.kt is missing.")
          main_text = "\n".join(p.read_text(encoding="utf-8") for p in main_files)
          if "ComponentActivity" not in main_text or "setContent" not in main_text:
              raise SystemExit("BLOCKED: launcher activity is not a Jetpack Compose ComponentActivity.")
          if any(token in main_text for token in ("BridgeActivity", "WebView", "loadUrl(")):
              raise SystemExit("BLOCKED: launcher activity contains a WebView/Capacitor entry point.")

          source_roots = [root / "app/src/main/java", root / "app/src/main/kotlin"]
          forbidden = ("android.webkit.WebView", "WebViewClient", "com.getcapacitor.BridgeActivity", "loadUrl(\"file:///android_asset")
          offenders = []
          for source_root in source_roots:
              if not source_root.exists():
                  continue
              for p in source_root.rglob("*"):
                  if p.suffix not in (".kt", ".java"):
                      continue
                  body = p.read_text(encoding="utf-8", errors="replace")
                  if any(token in body for token in forbidden):
                      offenders.append(str(p.relative_to(root)))
          if offenders:
              raise SystemExit("BLOCKED: WebView-based app source detected: " + ", ".join(offenders[:20]))

          gradle_text = ""
          for p in (root / "app/build.gradle", root / "app/build.gradle.kts", root / "build.gradle", root / "build.gradle.kts"):
              if p.exists():
                  gradle_text += p.read_text(encoding="utf-8", errors="replace") + "\n"
          if "compose" not in gradle_text.lower():
              raise SystemExit("BLOCKED: Jetpack Compose dependencies/buildFeatures were not found in Gradle configuration.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"project_root={root.relative_to(base)}\n")
          print("Native Compose source gate passed:", root.relative_to(base))
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native Android app
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.inspect.outputs.project_root }}"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -size +0c | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/build-output/DAYFLOW-native-debug.apk"

      - name: Verify APK integrity and reject web-shell artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile
          apks = list(pathlib.Path("build-output").glob("*.apk"))
          if len(apks) != 1 or apks[0].stat().st_size <= 0:
              raise SystemExit("APK verification failed: expected exactly one non-empty APK.")
          apk_path = apks[0]
          with zipfile.ZipFile(apk_path) as apk:
              names = set(apk.namelist())
              if "AndroidManifest.xml" not in names:
                  raise SystemExit("APK verification failed: AndroidManifest.xml missing.")
              if not any(n.startswith("classes") and n.endswith(".dex") for n in names):
                  raise SystemExit("APK verification failed: DEX bytecode missing.")
              bad = [n for n in names if n.startswith("assets/") and (n.endswith("index.html") or "capacitor" in n.lower())]
              if bad:
                  raise SystemExit("APK verification failed: web-shell assets detected: " + ", ".join(bad[:10]))
              corrupt = apk.testzip()
              if corrupt:
                  raise SystemExit("APK verification failed: corrupt entry " + corrupt)
          print("Verified native APK archive:", apk_path, "bytes:", apk_path.stat().st_size)
          PY


      # Run the product-data port even when the native Compose gate blocks this
      # source archive. This gives a verified migration artifact without ever
      # producing or publishing a WebView APK.
      - name: Extract and validate DAYFLOW native catalogs
        id: catalogs
        if: always() && hashFiles('extracted/src/lib/themes.ts', 'extracted/src/lib/widgets.ts') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/port-native-catalogs.py
          python3 .github/scripts/port-native-catalogs.py \
            --source-lib extracted/src/lib \
            --output build-output/native-catalogs
          mkdir -p android-native/compose-catalog
          changed=false
          for file in themes.json widgets.json catalog-validation.json; do
            if ! cmp -s "build-output/native-catalogs/$file" "android-native/compose-catalog/$file"; then
              cp "build-output/native-catalogs/$file" "android-native/compose-catalog/$file"
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Remove downloader product from DAYFLOW source
        id: strip
        if: always() && hashFiles('extracted/src/App.tsx') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/remove-downloader-features.py
          if [[ -f extracted/src/screens/Downloads.tsx ]]; then
            python3 .github/scripts/remove-downloader-features.py --source-root extracted
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Canonical source is already downloader-free; verifying its invariant set."
            ! grep -RniE 'DownloadManager|yt-dlp|gallery-dl|N_m3u8DL|aria2c|enqueueDownload|analyzeLink|startDownload|pauseDownload|cancelDownload|updateEngines|openSniffer|getPendingShare|#/downloads|"downloads"|Media Hub|Active downloads|Download history|Paste-link tile' extracted/src
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          test ! -e extracted/src/screens/Downloads.tsx
          test ! -e extracted/src/screens/MediaHub.tsx
          test ! -e extracted/src/lib/downloads.ts
          test ! -e extracted/src/lib/media.ts
          test ! -e extracted/src/lib/share.ts
          test -s extracted/src/lib/format.ts
          ! grep -RniE 'DownloadManager|yt-dlp|gallery-dl|N_m3u8DL|aria2c|enqueueDownload|analyzeLink|startDownload|pauseDownload|cancelDownload|updateEngines|openSniffer|getPendingShare|#/downloads|"downloads"|Media Hub|Active downloads|Download history|Paste-link tile' extracted/src
          echo "Downloader removal and source invariant checks passed."

      - name: Sanitize retained Android native system-feature archive
        id: native_clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/sanitize-native-archive.py
          python3 .github/scripts/sanitize-native-archive.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output build-output/native-source-sanitized.zip.b64
          test -s build-output/native-source-sanitized.zip.b64

      - name: Sanitize retained Android repair-script archive
        id: repair_clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/sanitize-repair-script-archive.py
          python3 .github/scripts/sanitize-repair-script-archive.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --report build-output/native-repair-archive-sanitized.txt
          test -s build-output/native-repair-archive-sanitized.txt

      - name: Inspect retained Android repair archive for downloader residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/inspect-native-repair-scripts.py
          python3 .github/scripts/inspect-native-repair-scripts.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --report build-output/native-repair-archive-audit.txt
          test -s build-output/native-repair-archive-audit.txt

      - name: Set up Node for legacy source regression build
        if: always() && hashFiles('extracted/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build cleaned DAYFLOW web source for migration regression only
        id: vite
        if: always() && hashFiles('extracted/package-lock.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          cd extracted
          npm ci
          node gen-assets.mjs
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            "https://images.unsplash.com/photo-1517359795165-71871b9e3266?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=82&w=1920" \
            --output src/assets/photos/dawn.jpg
          test -s src/assets/photos/dawn.jpg
          npm run build
          test -s dist/index.html
          echo "Vite source regression passed. This is not an Android APK and is not the Android UI release."

      - name: Package cleaned canonical DAYFLOW source
        if: always() && steps.strip.outputs.changed == 'true' && steps.vite.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path("extracted")
          output = Path("build-output/comprehensive-repository-audit-and-roadmap.zip")
          output.parent.mkdir(parents=True, exist_ok=True)
          files = [p for p in root.rglob("*") if p.is_file()
                   and not ({"node_modules", "dist", ".git"} & set(p.relative_to(root).parts))]
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(files):
                  archive.write(path, path.relative_to(root).as_posix())
          if output.stat().st_size <= 0:
              raise SystemExit("Refusing to publish an empty canonical source archive.")
          print(f"Packaged {len(files)} source files into {output} ({output.stat().st_size} bytes).")
          PY
          test -s build-output/comprehensive-repository-audit-and-roadmap.zip

      - name: Persist cleaned canonical DAYFLOW source on repair branch
        if: always() && (steps.strip.outputs.changed == 'true' || steps.native_clean.outputs.changed == 'true' || steps.repair_clean.outputs.changed == 'true' || steps.catalogs.outputs.changed == 'true') && steps.vite.outcome == 'success' && steps.native_clean.outcome == 'success' && steps.repair_clean.outcome == 'success' && steps.catalogs.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          STASHED_NATIVE=false
          if ! git diff --quiet -- android-native/native-source.zip.b64 android-native/repair-scripts-v2.part*.b64 android-native/compose-catalog/*.json; then
            git stash push -m "DAYFLOW sanitized native archives and Compose catalogs" -- android-native/native-source.zip.b64 android-native/repair-scripts-v2.part*.b64 android-native/compose-catalog/*.json
            STASHED_NATIVE=true
          fi
          git fetch origin repair/native-compose-only-gate
          git rebase origin/repair/native-compose-only-gate
          if [[ "$STASHED_NATIVE" == "true" ]]; then
            git stash pop
          fi
          if [[ -f build-output/comprehensive-repository-audit-and-roadmap.zip ]]; then
            cp build-output/comprehensive-repository-audit-and-roadmap.zip comprehensive-repository-audit-and-roadmap.zip
            git add comprehensive-repository-audit-and-roadmap.zip
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/native-source.zip.b64 android-native/repair-scripts-v2.part*.b64 android-native/compose-catalog/*.json
          if git diff --cached --quiet; then
            echo "Canonical source and native archive are already clean."
            exit 0
          fi
          git commit -m "chore: remove downloader tools from DAYFLOW source and native bridge"
          git push origin "HEAD:repair/native-compose-only-gate"

      - name: Upload downloader-free DAYFLOW source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-downloader-free-source
          path: |
            extracted/src/**
            extracted/android/app/src/main/**
            extracted/package.json
            extracted/package-lock.json
            build-output/comprehensive-repository-audit-and-roadmap.zip
            build-output/native-source-sanitized.zip.b64
            build-output/native-repair-archive-audit.txt
            build-output/native-repair-archive-sanitized.txt
            build-output/native-repair-scripts-review/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload native catalog migration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-native-catalogs
          path: build-output/native-catalogs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload verified native APK
        uses: actions/upload-artifact@v4
        with:
          name: DAYFLOW-native-Android-APK
          path: build-output/DAYFLOW-native-debug.apk
          if-no-files-found: error
          retention-days: 30
