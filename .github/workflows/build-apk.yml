name: LEGACY — Capacitor WebView (not the native DAYFLOW app)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired — do not distribute a WebView wrapper as native DAYFLOW
        run: |
          echo "This workflow was retired. It does not produce the native Android application."
          echo "Use the Build Native DAYFLOW APK workflow instead."
