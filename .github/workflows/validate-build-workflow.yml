name: Validate Android build workflow syntax

on:
  push:
    branches: [main, repair/widget-native-state-bridge]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow YAML and verify its execution graph
        shell: bash
        run: |
          ruby - <<'RUBY'
          require "yaml"
          workflow_path = ".github/workflows/build-apk.yml"
          data = YAML.load_file(workflow_path)
          puts "Root keys: #{data.keys.inspect}"
          triggers = data["on"] || data[true]
          abort "Workflow triggers are missing or invalid" unless triggers.is_a?(Hash)
          abort "Push trigger is missing" unless triggers.key?("push")
          jobs = data["jobs"]
          puts "Jobs: #{jobs&.keys&.inspect}"
          abort "GitHub Actions jobs map is missing or empty" unless jobs.is_a?(Hash) && !jobs.empty?
          job = jobs["build-apk"]
          abort "build-apk job is missing" unless job.is_a?(Hash)
          puts "Job keys: #{job.keys.inspect}"
          steps = job["steps"]
          abort "build-apk steps must be a non-empty array" unless steps.is_a?(Array) && !steps.empty?
          puts "Top name: #{data['name'].inspect}"
          puts "Trigger keys: #{triggers.keys.inspect}"
          puts "Steps count: #{steps.length}"
          steps.each_with_index do |step, index|
            abort "Step #{index + 1} is not a mapping" unless step.is_a?(Hash)
            bad = step.keys - %w[name id if uses run shell with env working-directory timeout-minutes continue-on-error]
            abort "Step #{index + 1} has unknown keys: #{bad.inspect}" unless bad.empty?
            puts "#{index + 1}: name=#{step['name'].inspect} keys=#{step.keys.inspect} run_type=#{step['run'].class if step.key?('run')} uses=#{step['uses'].inspect if step.key?('uses')}"
            abort "Step #{index + 1} run is not text" if step.key?("run") && !step["run"].is_a?(String)
            abort "Step #{index + 1} uses is not text" if step.key?("uses") && !step["uses"].is_a?(String)
          end
          puts "YAML and core job/step structure valid"
          RUBY

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint GitHub Actions workflow semantics
        shell: bash
        run: actionlint -color .github/workflows/*.yml

      - name: Validate Android build helper scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/build-dayflow-android.sh
          bash -n .github/scripts/build-dayflow-android.sh
          bash -n .github/scripts/emulator-smoke-test.sh
          python3 -m py_compile \
            .github/scripts/register-dayflow-bridge.py \
            .github/scripts/patch-app-features.py \
            .github/scripts/patch-native-alarms.py \
            .github/scripts/patch-native-alarm-snooze.py \
            .github/scripts/patch-native-download-cancel.py \
            .github/scripts/patch-native-task-reminders.py
          echo "Android build and emulator scripts passed syntax validation."

      - name: Validate emulator runner invokes one complete Bash script
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e 'workflow = YAML.load_file(".github/workflows/build-apk.yml"); steps = workflow.fetch("jobs").fetch("build-apk").fetch("steps"); step = steps.find { |item| item["uses"].to_s.start_with?("ReactiveCircus/android-emulator-runner@") }; script = step&.dig("with", "script").to_s.strip; abort "Emulator step must call the committed smoke-test script in one command" unless script.lines.length == 1 && script.include?(".github/scripts/emulator-smoke-test.sh")'
          bash -n .github/scripts/emulator-smoke-test.sh
          echo "Emulator smoke test is one complete Bash invocation and passes bash -n."
