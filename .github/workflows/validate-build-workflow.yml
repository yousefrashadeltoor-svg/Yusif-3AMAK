name: Validate Android native build workflows

on:
  push:
    branches: [main, repair/widget-native-state-bridge]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native project archive and Compose launcher
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/native-dayflow-source.part-00
          test -s .github/native-dayflow-source.part-10
          cat .github/native-dayflow-source.part-* | base64 --decode > /tmp/dayflow-native-source.tar.gz
          gzip -t /tmp/dayflow-native-source.tar.gz
          mkdir -p /tmp/native-dayflow-check
          tar -xzf /tmp/dayflow-native-source.tar.gz -C /tmp/native-dayflow-check
          grep -Fq 'setContent { DayflowApp(repository) }' /tmp/native-dayflow-check/app/src/main/java/app/dayflow/android/MainActivity.kt
          grep -Fq 'id("org.jetbrains.kotlin.plugin.compose")' /tmp/native-dayflow-check/build.gradle.kts
          grep -Fq 'androidx.compose.material3:material3' /tmp/native-dayflow-check/app/build.gradle.kts
          if grep -R -n -E 'android.webkit.WebView|com.getcapacitor|BridgeActivity|capacitor-android' /tmp/native-dayflow-check/app /tmp/native-dayflow-check/build.gradle.kts; then
            echo 'WebView/Capacitor found in the native Compose project.' >&2
            exit 1
          fi
          echo 'Native Compose source archive passes structural checks.'

      - name: Parse and validate native workflow graph
        shell: bash
        run: |
          ruby - <<'RUBY'
          require "yaml"
          path = ".github/workflows/build-native-apk.yml"
          data = YAML.load_file(path)
          triggers = data["on"] || data[true]
          abort "Native workflow must support push and manual dispatch" unless triggers.is_a?(Hash) && triggers.key?("push") && triggers.key?("workflow_dispatch")
          jobs = data["jobs"]
          abort "native-apk job missing" unless jobs.is_a?(Hash) && jobs["native-apk"].is_a?(Hash)
          steps = jobs["native-apk"]["steps"]
          abort "Native workflow has no steps" unless steps.is_a?(Array) && !steps.empty?
          abort "Compose build step missing" unless steps.any? { |s| s["name"].to_s.include?("Compile native Compose") }
          abort "Emulator step missing" unless steps.any? { |s| s["uses"].to_s.start_with?("ReactiveCircus/android-emulator-runner@") }
          puts "Native workflow structure valid (#{steps.length} steps)."
          RUBY

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Lint all GitHub Actions workflows
        run: actionlint -color .github/workflows/*.yml

      - name: Validate native emulator smoke-test script
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/native-emulator-smoke-test.sh
          ruby -ryaml -e 'w=YAML.load_file(".github/workflows/build-native-apk.yml"); s=w.fetch("jobs").fetch("native-apk").fetch("steps").find { |x| x["uses"].to_s.start_with?("ReactiveCircus/android-emulator-runner@") }; c=s&.dig("with","script").to_s.strip; abort "Emulator must use one complete smoke-test command" unless c.lines.length == 1 && c.include?("native-emulator-smoke-test.sh")'
          echo "Native emulator smoke-test entrypoint is valid."

      - name: Ensure legacy WebView workflow is not push-triggered
        shell: bash
        run: |
          ruby -ryaml -e 'w=YAML.load_file(".github/workflows/build-apk.yml"); t=w["on"] || w[true]; abort "Legacy WebView workflow must not run on pushes" if t.is_a?(Hash) && t.key?("push")'
          echo "Legacy WebView workflow is manual-only."
