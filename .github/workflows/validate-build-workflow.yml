name: Validate Android build workflow syntax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow YAML
        shell: bash
        run: |
          ruby - <<'RUBY'
          require "yaml"
          data = YAML.load_file(".github/workflows/build-apk.yml")
          puts "Root keys: #{data.keys.inspect}"
          jobs = data["jobs"]
          puts "Jobs: #{jobs&.keys&.inspect}"
          abort "GitHub Actions jobs map is missing or empty" unless jobs.is_a?(Hash) && !jobs.empty?
          abort "build-apk job is missing" unless jobs.key?("build-apk")
          puts "YAML syntax and jobs structure valid"
          RUBY